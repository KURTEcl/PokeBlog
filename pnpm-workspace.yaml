packages:
  - "."
  - "packages/*"

# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  better-sqlite3: true
  sharp: true
  workerd: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true

overrides:
  "@babel/generator": "7.28.6"
  "@babel/traverse": "7.28.6"
  "@babel/core": "7.28.6"
